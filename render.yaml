services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: |
      cd api
      pip install --upgrade pip
      # Install EVERYTHING with --no-deps to avoid any locked dependencies
      pip install --no-deps fastapi uvicorn python-multipart python-dotenv
      pip install --no-deps openai pymupdf pillow
      pip install --no-deps pinecone-client
      pip install --no-deps langchain-core langchain-openai langchain-text-splitters langchain-experimental langchain
      # Now install all the actual runtime dependencies manually
      pip install starlette anyio sniffio idna
      pip install 'pydantic>=2.0' pydantic-core pydantic-settings typing-extensions
      pip install httpx httpcore h11 certifi
      pip install requests urllib3
      pip install aiohttp aiohappyeyeballs frozenlist multidict yarl
      pip install sqlalchemy greenlet
      pip install tenacity jsonpatch jsonpointer pyyaml
      pip install tiktoken regex
      pip install langsmith orjson packaging
      pip install tqdm 'numpy<2.0'
      pip install distro jiter
      pip install click websockets watchfiles uvloop httptools
      pip install PyMuPDFb
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
