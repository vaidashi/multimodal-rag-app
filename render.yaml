services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: "cd api && pip install --upgrade pip && pip install 'simsimd>=5.0.0' && pip install -r requirements-prod.txt"
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
