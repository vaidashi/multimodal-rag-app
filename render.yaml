services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: |
      cd api
      pip install --upgrade pip
      # Install ALL packages WITHOUT version locking, letting pip resolve
      pip install fastapi 'uvicorn[standard]' python-multipart python-dotenv
      pip install openai pymupdf pillow
      # Install langchain without community (skip pinecone integration entirely)
      pip install langchain-core langchain-openai langchain-text-splitters langchain-experimental langchain
      # Install pinecone directly - latest version should work
      pip install 'pinecone-client>=5.0.0'
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
