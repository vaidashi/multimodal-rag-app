services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: "cd api && pip install -r requirements.txt"
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /api/health
