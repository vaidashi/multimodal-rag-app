services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: |
      cd api
      pip install --upgrade pip
      # Install base packages
      pip install fastapi 'uvicorn[standard]' python-multipart python-dotenv
      pip install openai pymupdf pillow
      # Install pinecone-client WITHOUT dependencies (likely has the locked simsimd)
      pip install --no-deps 'pinecone-client>=5.0.0'
      # Install LangChain packages WITHOUT dependencies
      pip install --no-deps langchain-core langchain-openai langchain-text-splitters langchain-experimental langchain
      # Manually install ALL dependencies
      pip install pydantic 'pydantic-core>=2.0' pydantic-settings typing-extensions
      pip install httpx requests aiohttp certifi urllib3
      pip install sqlalchemy tenacity jsonpatch pyyaml
      pip install tiktoken langsmith orjson packaging tqdm
      pip install 'numpy<2.0' jiter distro
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
