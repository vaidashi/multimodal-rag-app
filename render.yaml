services:
  - type: web
    name: multimodal-rag-api
    runtime: python
    buildCommand: |
      cd api
      pip install --upgrade pip
      # Install packages avoiding the simsimd conflict
      pip install fastapi uvicorn[standard] python-multipart python-dotenv
      pip install openai pymupdf pillow
      # Install compatible simsimd first
      pip install 'simsimd>=5.0.0'
      # Install langchain packages (using community for Pinecone integration)
      pip install langchain langchain-core langchain-openai langchain-text-splitters langchain-experimental langchain-community
      # Install pinecone separately with --no-deps to avoid locked simsimd
      pip install --no-deps pinecone-client==5.0.1
      # Install pinecone dependencies manually
      pip install 'urllib3>=1.26' 'certifi>=2023' 'tqdm>=4.64.1' 'typing-extensions>=3.7.4'
    startCommand: "cd api && uvicorn index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
